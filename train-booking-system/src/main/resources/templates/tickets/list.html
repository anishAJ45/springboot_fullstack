<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tickets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/App/App.css">
</head>
<body>
  <!-- NAVIGATION BAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/"><i class="fas fa-train"></i> Railway Reservation</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="/"><i class="fas fa-home"></i> Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/trains"><i class="fas fa-train"></i> Trains</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="/tickets"><i class="fas fa-ticket-alt"></i> Tickets</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/users"><i class="fas fa-users"></i> Users</a>
          </li>
          <li class="nav-item">
            <button class="btn btn-outline-light ms-2" data-bs-toggle="modal" data-bs-target="#loginModal"><i class="fas fa-sign-in-alt"></i> Login</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- LOGIN MODAL -->
  <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="loginModalLabel">User Login</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" placeholder="Enter your email">
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" placeholder="Enter your password">
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1><i class="fas fa-ticket-alt"></i> Tickets</h1>
      <a th:href="@{/tickets/new}" class="btn btn-primary"><i class="fas fa-plus"></i> Book New Ticket</a>
    </div>

    <!-- Search/Filter Section -->
    <div class="card mb-4">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-3">
            <input type="text" class="form-control" id="searchUser" placeholder="Search by User">
          </div>
          <div class="col-md-3">
            <input type="text" class="form-control" id="searchTrain" placeholder="Search by Train">
          </div>
          <div class="col-md-3">
            <input type="date" class="form-control" id="searchDate" placeholder="Search by Booking Date">
          </div>
          <div class="col-md-3">
            <button class="btn btn-secondary w-100" id="clearFilters"><i class="fas fa-times"></i> Clear Filters</button>
          </div>
        </div>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-striped table-hover" id="ticketsTable">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>User</th>
            <th>Train</th>
            <th>Booking Date</th>
            <th>Final Price</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="ticket : ${tickets}" class="ticket-row">
            <td th:text="${ticket.id}"></td>
            <td th:text="${ticket.user.name}"></td>
            <td th:text="${ticket.train.name}"></td>
            <td th:text="${ticket.bookingDate != null ? #temporals.format(ticket.bookingDate, 'dd/MM/yyyy') : 'N/A'}"></td>
            <td th:text="'₹' + ${ticket.finalPrice}"></td>
            <td>
              <a th:href="@{/tickets/edit/{id}(id=${ticket.id})}" class="btn btn-sm btn-outline-primary me-2" data-bs-toggle="tooltip" title="Edit"><i class="fas fa-edit"></i></a>
              <button class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" data-bs-target="#deleteModal" th:data-id="${ticket.id}" title="Delete"><i class="fas fa-trash"></i></button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="deleteModalLabel">Confirm Delete</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            Are you sure you want to delete this ticket?
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <a id="confirmDelete" href="#" class="btn btn-danger">Delete</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/App/App.js"></script>
  <script>
    // Initialize tooltips
    var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
    var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
      return new bootstrap.Tooltip(tooltipTriggerEl);
    });

    // Search and Filter Functionality
    document.getElementById('searchUser').addEventListener('input', filterTable);
    document.getElementById('searchTrain').addEventListener('input', filterTable);
    document.getElementById('searchDate').addEventListener('input', filterTable);

    function filterTable() {
      const userFilter = document.getElementById('searchUser').value.toLowerCase();
      const trainFilter = document.getElementById('searchTrain').value.toLowerCase();
      const dateFilter = document.getElementById('searchDate').value;
      const rows = document.querySelectorAll('.ticket-row');

      rows.forEach(row => {
        const user = row.cells[1].textContent.toLowerCase();
        const train = row.cells[2].textContent.toLowerCase();
        const date = row.cells[3].textContent;

        const userMatch = user.includes(userFilter);
        const trainMatch = train.includes(trainFilter);
        const dateMatch = dateFilter === '' || date === dateFilter;

        if (userMatch && trainMatch && dateMatch) {
          row.style.display = '';
        } else {
          row.style.display = 'none';
        }
      });
    }

    // Clear Filters
    document.getElementById('clearFilters').addEventListener('click', function() {
      document.getElementById('searchUser').value = '';
      document.getElementById('searchTrain').value = '';
      document.getElementById('searchDate').value = '';
      filterTable();
    });

    // Delete Modal Functionality
    var deleteModal = document.getElementById('deleteModal');
    deleteModal.addEventListener('show.bs.modal', function (event) {
      var button = event.relatedTarget;
      var ticketId = button.getAttribute('th:data-id');
      var confirmDelete = document.getElementById('confirmDelete');
      confirmDelete.href = '/tickets/delete/' + ticketId;
    });
  </script>
</body>
</html>
