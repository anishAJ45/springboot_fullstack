<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:if="${ticket.id == null}">Book New Ticket</title>
    <title th:if="${ticket.id != null}">Edit Ticket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/App/App.css">
</head>
<body>
  <!-- NAVIGATION BAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/"><i class="fas fa-train"></i> Railway Reservation</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="/"><i class="fas fa-home"></i> Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/trains"><i class="fas fa-train"></i> Trains</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="/tickets"><i class="fas fa-ticket-alt"></i> Tickets</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/users"><i class="fas fa-users"></i> Users</a>
          </li>
          <li class="nav-item">
            <button class="btn btn-outline-light ms-2" data-bs-toggle="modal" data-bs-target="#loginModal"><i class="fas fa-sign-in-alt"></i> Login</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- LOGIN MODAL -->
  <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="loginModalLabel">User Login</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" placeholder="Enter your email">
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" placeholder="Enter your password">
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="container mt-4">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card">
          <div class="card-header bg-primary text-white">
            <h2 class="mb-0"><i class="fas fa-ticket-alt"></i> <span th:if="${ticket.id == null}">Book New Ticket</span><span th:if="${ticket.id != null}">Edit Ticket</span></h2>
          </div>
          <div class="card-body">
            <form th:action="${ticket.id == null} ? @{/tickets} : @{/tickets/update/{id}(id=${ticket.id})}" method="post" id="ticketForm" class="needs-validation" novalidate>
              <div class="row mb-3">
                <div class="col-md-6">
                  <label for="user" class="form-label">User <span class="text-danger">*</span></label>
                  <select name="userId" id="user" class="form-select" required>
                    <option value="">Select a user</option>
                    <option th:each="user : ${users}" th:value="${user.id}" th:text="${user.name}"
                        th:selected="${ticket.user != null and ticket.user.id == user.id}"></option>
                  </select>
                  <div class="invalid-feedback">
                    Please select a user.
                  </div>
                </div>
                <div class="col-md-6">
                  <label for="train" class="form-label">Train <span class="text-danger">*</span></label>
                  <select name="trainId" id="train" class="form-select" required>
                    <option value="">Select a train</option>
                    <option th:each="train : ${trains}" th:value="${train.id}" th:text="${train.name} + ' (' + ${train.source} + ' to ' + ${train.destination} + ')'"
                        th:selected="${ticket.train != null and ticket.train.id == train.id}"></option>
                  </select>
                  <div class="invalid-feedback">
                    Please select a train.
                  </div>
                </div>
              </div>
              <div class="d-flex justify-content-between">
                <a href="/tickets" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back to Tickets</a>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Ticket</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/App/App.js"></script>
  <script>
    // Form validation
    (function () {
      'use strict'

      var forms = document.querySelectorAll('.needs-validation')

      Array.prototype.slice.call(forms)
        .forEach(function (form) {
          form.addEventListener('submit', function (event) {
            if (!form.checkValidity()) {
              event.preventDefault()
              event.stopPropagation()
            }

            form.classList.add('was-validated')
          }, false)
        })
    })()
  </script>
</body>
</html>
